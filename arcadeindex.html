<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            flex-direction: column;
        }
        .topnav {
            width: 100%;
            overflow: hidden;
            background-color: #333;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .topnav a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
            font-family: Verdana, sans-serif;
        }
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }
        .topnav a.active {
            background-color: #ff6b6b;
            color: white;
        }
        #menu { text-align: center; margin-top: 60px; }
        h1 { color: #ff6b6b; font-size: 36px; margin: 20px 0; text-shadow: 0 0 20px #ff6b6b; }
        p { color: #888; margin-bottom: 30px; }
        .game-btn {
            display: block;
            width: 280px;
            padding: 20px;
            margin: 15px auto;
            font-size: 20px;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            line-height: 1.2;
        }
        .car-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .stack-btn { background: linear-gradient(135deg, #3498db, #2980b9); }
        .plane-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .snake-btn { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .bounce-btn { background: linear-gradient(135deg, #222, #000); }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="index.html">Home</a>
        <a href="paintings.html">Arts and Crafts</a>
        <a href="stories.html">Stories</a>
        <a href="codings.html">Codings</a>
        <a href="arcadeindex.html" class="active">Games</a>
    </div>

    <div id="menu">
        <h1>ARCADE GAMES</h1>
        <p>Choose a game</p>
        <a href="carracer.html" class="game-btn car-btn">Car Racer</a>
        <a href="blockmatch.html" class="game-btn stack-btn">Block Match</a>
        <a href="flyingaeroplane.html" class="game-btn plane-btn">Flying Aeroplane</a>
        <a href="snake.html" class="game-btn snake-btn">Snake</a>
        <a href="balldrop.html" class="game-btn bounce-btn">Ball Drop</a>
    </div>
</body>
</html>
