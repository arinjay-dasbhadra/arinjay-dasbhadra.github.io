<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flying Aeroplane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameArea {
            width: 360px;
            height: 640px;
            background: #1a1a2e;
            border: 4px solid #ff6b6b;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        #backBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            z-index: 999;
            text-decoration: none;
            font-size: 14px;
        }
        #planeGame { width: 100%; height: 100%; position: absolute; background: #87CEEB; }
        #planeArea { position: absolute; width: 100%; height: 100%; }
        #planeArea .plane { position: absolute; width: 60px; height: 35px; }
        #planeArea .plane-body { position: absolute; width: 40px; height: 20px; background: #e74c3c; border-radius: 10px 20px 20px 10px; left: 10px; top: 8px; }
        #planeArea .plane-wing { position: absolute; width: 25px; height: 8px; background: #c0392b; left: 15px; top: 16px; border-radius: 2px; }
        #planeArea .plane-wing-bottom { position: absolute; width: 25px; height: 8px; background: #c0392b; left: 15px; top: 24px; border-radius: 2px; }
        #planeArea .plane-tail { position: absolute; width: 12px; height: 10px; background: #e74c3c; left: 0px; top: 12px; border-radius: 3px; }
        #planeArea .plane-propeller { position: absolute; width: 4px; height: 18px; background: #333; left: 50px; top: 16px; border-radius: 2px; animation: spin 0.1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #planeArea .pipe { position: absolute; width: 50px; background: #228B22; border-radius: 5px; }
        #planeArea .ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
        .ui-box { background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 6px; color: #fff; font-size: 16px; display: inline-block; }
        .score-val { color: #f1c40f; }
        #planeArea .gameOver { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20; justify-content: center; align-items: center; flex-direction: column; color: #fff; }
        #planeArea .gameOver h1 { font-size: 32px; color: #e74c3c; }
        .restartBtn { padding: 12px 30px; font-size: 18px; background: #ff6b6b; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="gameArea">
        <a href="arcadeindex.html" id="backBtn">&#8592; Menu</a>
        <div id="planeGame">
            <div id="planeArea">
                <div class="ui"><span class="ui-box">SCORE: <span class="score-val" id="planeScore">0</span></span><span class="ui-box" style="margin-left:10px">UP=tap to fly</span></div>
                <div id="planeGameOver" class="gameOver"><h1>GAME OVER</h1><p>Score: <span id="planeFinalScore">0</span></p><button class="restartBtn" onclick="restartPlane()">PLAY AGAIN</button></div>
            </div>
        </div>
    </div>

    <script>
        var planeGame = null;
        var planeScore = 0;
        var planePlayer = {x: 80, y: 300, vy: 0};
        var planePipes = [];
        var planeRunning = false;
        var planeSpeed = 3;

        function initPlane() {
            var area = document.getElementById('planeArea');
            area.querySelectorAll('.plane, .pipe').forEach(function(el) { el.remove(); });
            planePipes = []; planeScore = 0; planeSpeed = 2;
            document.getElementById('planeScore').innerHTML = '0';
            document.getElementById('planeGameOver').style.display = 'none';
            planePlayer = {x: 80, y: 300, vy: 0};
            
            var player = document.createElement('div');
            player.className = 'plane'; player.id = 'planePlayer';
            player.style.left = '80px'; player.style.top = '300px';
            player.innerHTML = '<div class="plane-body"></div><div class="plane-wing"></div><div class="plane-wing-bottom"></div><div class="plane-tail"></div><div class="plane-propeller"></div>';
            area.appendChild(player);
            
            planeRunning = true;
            if (planeGame) cancelAnimationFrame(planeGame);
            updatePlane();
        }

        function createPipe() {
            var gap = 180;
            var gapY = 80 + Math.random() * 280;
            var area = document.getElementById('planeArea');
            
            var topPipe = document.createElement('div');
            topPipe.className = 'pipe'; topPipe.style.left = '420px'; topPipe.style.top = '0px';
            topPipe.style.width = '50px'; topPipe.style.height = gapY + 'px';
            area.appendChild(topPipe);
            
            var bottomPipe = document.createElement('div');
            bottomPipe.className = 'pipe'; bottomPipe.style.left = '420px';
            bottomPipe.style.top = (gapY + gap) + 'px'; bottomPipe.style.width = '50px';
            bottomPipe.style.height = (600 - gapY - gap) + 'px';
            area.appendChild(bottomPipe);
            
            planePipes.push({x: 420, gapY: gapY, gap: gap, topEl: topPipe, bottomEl: bottomPipe});
        }

        function updatePlane() {
            if (!planeRunning) return;
            planeScore++; document.getElementById('planeScore').innerHTML = planeScore;
            planeSpeed += 0.001; if (planeSpeed > 7) planeSpeed = 7;
            planePlayer.vy += 0.4; if (planePlayer.vy > 8) planePlayer.vy = 8;
            planePlayer.y += planePlayer.vy;
            if (planePlayer.y < 0 || planePlayer.y > 560) { endPlane(); return; }
            
            for (var i = 0; i < planePipes.length; i++) {
                planePipes[i].x -= planeSpeed;
                planePipes[i].topEl.style.left = planePipes[i].x + 'px';
                planePipes[i].bottomEl.style.left = planePipes[i].x + 'px';
                if (planePlayer.x + 40 > planePipes[i].x && planePlayer.x < planePipes[i].x + 50) {
                    if (planePlayer.y < planePipes[i].gapY || planePlayer.y + 25 > planePipes[i].gapY + planePipes[i].gap) { endPlane(); return; }
                }
                if (planePipes[i].x < -50) {
                    planePipes[i].topEl.remove(); planePipes[i].bottomEl.remove();
                    planePipes.splice(i, 1); i--;
                }
            }
            var canSpawn = true;
            if (planePipes.length > 0) {
                var lastPipe = planePipes[planePipes.length - 1];
                if (lastPipe.x > 120) canSpawn = false;
            }
            if (canSpawn && Math.random() < 0.02) createPipe();
            
            var playerEl = document.getElementById('planePlayer');
            if (playerEl) playerEl.style.top = planePlayer.y + 'px';
            planeGame = requestAnimationFrame(updatePlane);
        }

        function endPlane() {
            planeRunning = false;
            if (planeGame) cancelAnimationFrame(planeGame);
            document.getElementById('planeFinalScore').innerHTML = planeScore;
            document.getElementById('planeGameOver').style.display = 'flex';
        }

        function restartPlane() { initPlane(); }

        document.addEventListener('keydown', function(e) {
            if ((e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp' || e.key === ' ') && planeRunning) {
                planePlayer.vy = -8;
            }
        });

        document.getElementById('planeArea').addEventListener('touchstart', function(e) {
            if (!planeRunning) return;
            planePlayer.vy = -7;
        });

        initPlane();
    </script>
</body>
</html>
