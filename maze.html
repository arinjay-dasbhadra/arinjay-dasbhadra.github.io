<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            flex-direction: column;
        }
        #gameContainer {
            background: #16213e;
            border: 4px solid #9b59b6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
        }
        h1 { color: #9b59b6; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 15px #9b59b6; }
        canvas {
            border: 3px solid #9b59b6;
            border-radius: 6px;
            cursor: crosshair;
            display: block;
            margin: 10px auto;
            background: #fff;
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .controls button, .controls .mode-btn {
            padding: 10px 20px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .mode-btn.active { box-shadow: 0 0 15px currentColor; transform: scale(1.05); }
        #wallMode { background: #555; color: #fff; }
        #wallMode.active { background: #333; box-shadow: 0 0 15px #555; }
        #startMode { background: #2ecc71; color: #fff; }
        #startMode.active { box-shadow: 0 0 15px #2ecc71; }
        #wpMode { background: #3498db; color: #fff; }
        #wpMode.active { box-shadow: 0 0 15px #3498db; }
        #endMode { background: #e74c3c; color: #fff; }
        #endMode.active { box-shadow: 0 0 15px #e74c3c; }
        #eraseMode { background: #f39c12; color: #fff; }
        #eraseMode.active { box-shadow: 0 0 15px #f39c12; }
        #solveBtn { background: #9b59b6; color: #fff; }
        #solveBtn:hover { background: #8e44ad; }
        #clearBtn { background: #555; color: #fff; }
        #clearBtn:hover { background: #444; }
        .upload-wrap {
            position: relative;
            display: inline-block;
        }
        .upload-wrap input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .upload-label {
            display: inline-block;
            padding: 10px 20px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #2c3e50;
            color: #fff;
            transition: 0.2s;
        }
        .upload-label:hover { background: #1a252f; }
        #removeImgBtn { background: #e67e22; color: #fff; }
        #removeImgBtn:hover { background: #d35400; }
        .threshold-row { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #aaa; font-size: 14px; }
        .threshold-row input[type="range"] { width: 200px; cursor: pointer; }
        .threshold-row span { color: #fff; font-weight: bold; min-width: 30px; }
        #detectBtn { background: #2c3e50; color: #fff; }
        #backBtn {
            padding: 8px 16px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #status { color: #aaa; font-size: 14px; margin-top: 10px; min-height: 24px; }
        .status-path { color: #2ecc71; }
        .status-nopath { color: #e74c3c; }
        .status-info { color: #f39c12; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="top-row">
            <h1>MAZE SOLVER</h1>
            <a href="arcadeindex.html" id="backBtn">&#8592; Menu</a>
        </div>
        <canvas id="mazeCanvas" width="500" height="500"></canvas>
        <div class="controls">
            <button id="wallMode" class="mode-btn active">Draw Wall</button>
            <button id="startMode" class="mode-btn">Place Start</button>
            <button id="wpMode" class="mode-btn">Place Waypoint</button>
            <button id="endMode" class="mode-btn">Place End</button>
            <button id="eraseMode" class="mode-btn">Erase</button>
            <button id="solveBtn">Solve</button>
            <button id="clearBtn">Clear All</button>
            <span class="upload-wrap">
                <span class="upload-label">Upload Image</span>
                <input type="file" id="imageUpload" accept="image/*">
            </span>
            <button id="removeImgBtn">Remove Image</button>
        </div>
        <div class="threshold-row">
            <label>Wall threshold:</label>
            <input type="range" id="thresholdSlider" min="0" max="255" value="180">
            <span id="thresholdVal">180</span>
            <button id="detectBtn">Auto Detect</button>
        </div>
        <div id="status">Draw walls, place Start (S) then Waypoints (A,B,C...) then End (E), then Solve</div>
    </div>

    <script>
        var canvas = document.getElementById('mazeCanvas');
        var ctx = canvas.getContext('2d');
        var CELL_SIZE = 10;
        var COLS = 50;
        var ROWS = 50;

        var grid = [];
        var start = null;
        var waypoints = [];
        var end = null;
        var drawing = false;
        var bgImage = null;
        var animFrame = null;
        var animating = false;

        for (var r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (var c = 0; c < COLS; c++) {
                grid[r][c] = 0;
            }
        }

        var modes = ['wall', 'start', 'wp', 'end', 'erase'];
        var currentMode = 'wall';

        var modeButtons = {
            wall: document.getElementById('wallMode'),
            start: document.getElementById('startMode'),
            wp: document.getElementById('wpMode'),
            end: document.getElementById('endMode'),
            erase: document.getElementById('eraseMode')
        };

        function setMode(mode) {
            currentMode = mode;
            for (var m in modeButtons) {
                modeButtons[m].classList.toggle('active', m === mode);
            }
        }

        modeButtons.wall.onclick = function() { setMode('wall'); };
        modeButtons.start.onclick = function() { setMode('start'); };
        modeButtons.wp.onclick = function() { setMode('wp'); };
        modeButtons.end.onclick = function() { setMode('end'); };
        modeButtons.erase.onclick = function() { setMode('erase'); };

        function getCell(e) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = canvas.width / rect.width;
            var scaleY = canvas.height / rect.height;
            var x = (e.clientX - rect.left) * scaleX;
            var y = (e.clientY - rect.top) * scaleY;
            var col = Math.floor(x / CELL_SIZE);
            var row = Math.floor(y / CELL_SIZE);
            if (col < 0) col = 0;
            if (row < 0) row = 0;
            if (col >= COLS) col = COLS - 1;
            if (row >= ROWS) row = ROWS - 1;
            return {row: row, col: col};
        }

        function isOccupied(row, col) {
            if (start && start.row === row && start.col === col) return true;
            if (end && end.row === row && end.col === col) return true;
            for (var i = 0; i < waypoints.length; i++) {
                if (waypoints[i].row === row && waypoints[i].col === col) return true;
            }
            return false;
        }

        canvas.onmousedown = function(e) {
            drawing = true;
            var cell = getCell(e);
            if (currentMode === 'wall') {
                if (!isOccupied(cell.row, cell.col)) {
                    grid[cell.row][cell.col] = 1;
                    drawGrid();
                }
            } else if (currentMode === 'erase') {
                grid[cell.row][cell.col] = 0;
                drawGrid();
            } else if (currentMode === 'start') {
                placeStart(cell);
            } else if (currentMode === 'wp') {
                placeWaypoint(cell);
            } else if (currentMode === 'end') {
                placeEnd(cell);
            }
        };

        canvas.onmousemove = function(e) {
            if (!drawing) return;
            var cell = getCell(e);
            if (currentMode === 'wall') {
                if (!isOccupied(cell.row, cell.col)) {
                    grid[cell.row][cell.col] = 1;
                    drawGrid();
                }
            } else if (currentMode === 'erase') {
                grid[cell.row][cell.col] = 0;
                drawGrid();
            }
        };

        canvas.onmouseup = function() { drawing = false; };
        canvas.onmouseleave = function() { drawing = false; };

        function placeStart(cell) {
            if (isOccupied(cell.row, cell.col) || grid[cell.row][cell.col] === 1) return;
            start = {row: cell.row, col: cell.col};
            setMode('wp');
            drawGrid();
        }

        function placeWaypoint(cell) {
            if (isOccupied(cell.row, cell.col) || grid[cell.row][cell.col] === 1) return;
            var label = String.fromCharCode(65 + waypoints.length);
            waypoints.push({row: cell.row, col: cell.col, label: label});
            drawGrid();
        }

        function placeEnd(cell) {
            if (isOccupied(cell.row, cell.col) || grid[cell.row][cell.col] === 1) return;
            end = {row: cell.row, col: cell.col};
            setMode('wall');
            drawGrid();
        }

        function drawGrid() {
            if (animating) return;
            if (bgImage) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            for (var r = 0; r < ROWS; r++) {
                for (var c = 0; c < COLS; c++) {
                    if (grid[r][c] === 1) {
                        ctx.fillStyle = '#555';
                        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            for (var i = 0; i < waypoints.length; i++) {
                var wp = waypoints[i];
                ctx.fillStyle = '#3498db';
                ctx.fillRect(wp.col * CELL_SIZE, wp.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(wp.label, wp.col * CELL_SIZE + CELL_SIZE / 2, wp.row * CELL_SIZE + CELL_SIZE / 2);
            }

            if (start) {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(start.col * CELL_SIZE, start.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', start.col * CELL_SIZE + CELL_SIZE / 2, start.row * CELL_SIZE + CELL_SIZE / 2);
            }

            if (end) {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(end.col * CELL_SIZE, end.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', end.col * CELL_SIZE + CELL_SIZE / 2, end.row * CELL_SIZE + CELL_SIZE / 2);
            }

            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 0.5;
            for (var r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * CELL_SIZE);
                ctx.lineTo(canvas.width, r * CELL_SIZE);
                ctx.stroke();
            }
            for (var c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * CELL_SIZE, 0);
                ctx.lineTo(c * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
        }

        function bfsBetween(fromRow, fromCol, toRow, toCol) {
            var directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            var visited = [];
            for (var r = 0; r < ROWS; r++) {
                visited[r] = [];
                for (var c = 0; c < COLS; c++) {
                    visited[r][c] = false;
                }
            }
            var queue = [{row: fromRow, col: fromCol, path: [{row: fromRow, col: fromCol}]}];
            visited[fromRow][fromCol] = true;
            while (queue.length > 0) {
                var cur = queue.shift();
                if (cur.row === toRow && cur.col === toCol) {
                    return cur.path;
                }
                for (var d = 0; d < directions.length; d++) {
                    var nr = cur.row + directions[d][0];
                    var nc = cur.col + directions[d][1];
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited[nr][nc] && grid[nr][nc] !== 1) {
                        visited[nr][nc] = true;
                        var newPath = cur.path.concat([{row: nr, col: nc}]);
                        queue.push({row: nr, col: nc, path: newPath});
                    }
                }
            }
            return null;
        }

        function solveMaze() {
            if (!start || !end) {
                document.getElementById('status').innerHTML = '<span class="status-info">Place both Start (S) and End (E) points first!</span>';
                return;
            }

            var fullPath = [];
            var points = [start].concat(waypoints).concat([end]);

            for (var i = 0; i < points.length - 1; i++) {
                var from = points[i];
                var to = points[i + 1];
                var seg = bfsBetween(from.row, from.col, to.row, to.col);
                if (seg === null) {
                    document.getElementById('status').innerHTML = '<span class="status-nopath">No path found between ' +
                        (i === 0 ? 'S' : String.fromCharCode(64 + i)) + ' and ' +
                        (i === points.length - 2 ? 'E' : String.fromCharCode(65 + i)) + '!</span>';
                    return;
                }
                if (i === 0) {
                    fullPath = seg;
                } else {
                    fullPath = fullPath.concat(seg.slice(1));
                }
            }

            document.getElementById('status').innerHTML = '<span class="status-path">Path found! (' + fullPath.length + ' steps)</span>';
            animateBall(fullPath);
        }

        function animateBall(path) {
            if (animFrame) cancelAnimationFrame(animFrame);
            animating = true;
            var index = 0;
            var speed = 20;

            function step() {
                if (index >= path.length - 1) {
                    animating = false;
                    drawGrid();
                    drawPointsOnTop();
                    var cx = path[path.length - 1].col * CELL_SIZE + CELL_SIZE / 2;
                    var cy = path[path.length - 1].row * CELL_SIZE + CELL_SIZE / 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    return;
                }

                drawGrid();
                drawPointsOnTop();

                ctx.fillStyle = 'rgba(46, 204, 113, 0.15)';
                for (var i = 0; i <= index; i++) {
                    ctx.fillRect(path[i].col * CELL_SIZE, path[i].row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }

                ctx.strokeStyle = 'rgba(46, 204, 113, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(path[0].col * CELL_SIZE + CELL_SIZE / 2, path[0].row * CELL_SIZE + CELL_SIZE / 2);
                for (var i = 1; i <= index; i++) {
                    ctx.lineTo(path[i].col * CELL_SIZE + CELL_SIZE / 2, path[i].row * CELL_SIZE + CELL_SIZE / 2);
                }
                ctx.stroke();

                var cx2 = path[index].col * CELL_SIZE + CELL_SIZE / 2;
                var cy2 = path[index].row * CELL_SIZE + CELL_SIZE / 2;
                var grad = ctx.createRadialGradient(cx2 - 3, cy2 - 3, 1, cx2, cy2, 7);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.4, '#2ecc71');
                grad.addColorStop(1, '#1a8a4a');
                ctx.beginPath();
                ctx.arc(cx2, cy2, 7, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                index++;
                animFrame = setTimeout(function() { animFrame = requestAnimationFrame(step); }, speed);
            }

            step();
        }

        function drawPointsOnTop() {
            for (var i = 0; i < waypoints.length; i++) {
                var wp = waypoints[i];
                ctx.fillStyle = '#3498db';
                ctx.fillRect(wp.col * CELL_SIZE, wp.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(wp.label, wp.col * CELL_SIZE + CELL_SIZE / 2, wp.row * CELL_SIZE + CELL_SIZE / 2);
            }
            if (start) {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(start.col * CELL_SIZE, start.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', start.col * CELL_SIZE + CELL_SIZE / 2, start.row * CELL_SIZE + CELL_SIZE / 2);
            }
            if (end) {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(end.col * CELL_SIZE, end.row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', end.col * CELL_SIZE + CELL_SIZE / 2, end.row * CELL_SIZE + CELL_SIZE / 2);
            }
        }

        function clearAll() {
            if (animFrame) { clearTimeout(animFrame); cancelAnimationFrame(animFrame); animFrame = null; }
            animating = false;
            for (var r = 0; r < ROWS; r++) {
                for (var c = 0; c < COLS; c++) {
                    grid[r][c] = 0;
                }
            }
            start = null;
            waypoints = [];
            end = null;
            drawGrid();
            document.getElementById('status').innerHTML = 'Draw walls, place Start (S) then Waypoints (A,B,C...) then End (E), then Solve';
        }

        function autoDetectWalls() {
            if (!bgImage) return;
            var c = document.createElement('canvas');
            c.width = canvas.width;
            c.height = canvas.height;
            var cx = c.getContext('2d');
            cx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            var imageData = cx.getImageData(0, 0, canvas.width, canvas.height);
            var data = imageData.data;
            var threshold = parseInt(document.getElementById('thresholdSlider').value);

            for (var r = 0; r < ROWS; r++) {
                for (var c2 = 0; c2 < COLS; c2++) {
                    var pixelX = Math.floor(c2 * CELL_SIZE + CELL_SIZE / 2);
                    var pixelY = Math.floor(r * CELL_SIZE + CELL_SIZE / 2);
                    var idx = (pixelY * canvas.width + pixelX) * 4;
                    var brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                    grid[r][c2] = brightness < threshold ? 1 : 0;
                }
            }
            start = null;
            waypoints = [];
            end = null;
            drawGrid();
            document.getElementById('status').innerHTML = '<span class="status-info">Walls auto-detected. Place S, waypoints, and E.</span>';
        }

        document.getElementById('solveBtn').onclick = solveMaze;
        document.getElementById('clearBtn').onclick = clearAll;

        document.getElementById('thresholdSlider').oninput = function() {
            document.getElementById('thresholdVal').textContent = this.value;
        };

        document.getElementById('detectBtn').onclick = autoDetectWalls;

        document.getElementById('imageUpload').onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    bgImage = img;
                    start = null;
                    waypoints = [];
                    end = null;
                    autoDetectWalls();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('removeImgBtn').onclick = function() {
            bgImage = null;
            document.getElementById('imageUpload').value = '';
            for (var r = 0; r < ROWS; r++) {
                for (var c2 = 0; c2 < COLS; c2++) {
                    grid[r][c2] = 0;
                }
            }
            start = null;
            waypoints = [];
            end = null;
            drawGrid();
            document.getElementById('status').innerHTML = 'Draw walls, place Start (S) then Waypoints (A,B,C...) then End (E), then Solve';
        };

        drawGrid();
    </script>
</body>
</html>
